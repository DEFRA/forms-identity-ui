{% extends "layouts/page.html" %}

{% block content %}
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
      <h1 class="govuk-heading-l">{{ message }}</h1>
      {% if statusCode == 404 %}
        <p class="govuk-body">{{ t('errors.notFound.typed') }}</p>
        <p class="govuk-body">{{ t('errors.notFound.pasted') }}</p>
      {% else %}
        <p class="govuk-body">{{ t('errors.serverError.tryLater') }}</p>
      {% endif %}
    </div>
  </div>
{% endblock %}
